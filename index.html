<!DOCTYPE html>
<html>
<head>
<title>System Message</title>
<style>

  .dialog-box {
  width: 380px;
  background-color: #ffffff;
  border: 1px solid #999;
  box-shadow: 3px 3px 10px rgba(0,0,0,0.3);
}

  .loading-screen p {
  margin-top: 15px;
}
  .loading-screen p {
  margin-top: 15px;
  font-weight: 500;
  color: #444;
  letter-spacing: 1px;
}
  .spinner {
  width: 50px;
  height: 50px;
  border: 6px solid #ddd;
  border-top: 6px solid #333;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  from {
    transform: rotate(0deg);
  }
  to {
    transform: rotate(360deg);
  }
}
  .loading-screen {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: white;
  text-align: center;

  display:none;
  align-items:center;
  justify-content: center;
  
}
  body {
    margin: 0;
    background-color: #f0f0f0;
    font-family: "Segoe UI", Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }



  .dialog-title {
    background-color: #0057cc;
    color: white;
    padding: 8px 12px;
    font-size: 14px;
    font-weight: bold;
  }


  .dialog-body {
    padding: 20px;
    font-size: 15px;
    color: black;
  }

  .dialog-buttons {
    text-align: right;
    padding: 10px 15px 15px 15px;
  }

  .dialog-buttons button {
    padding: 6px 18px;
    margin-left: 10px;
    font-size: 14px;
    cursor: pointer;
  }

#scareVideo {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: contain; 
  z-index: 999;
  background-color: black;  
}
</style>
</head>
<body>
  
<div class="loading-screen">
  <div class="spinner"></div>
  <p>Loading....</p>
</div>
<div class="dialog-box" id="dialogBox">
  <div class="dialog-title">ghost detector</div>
  <div class="dialog-body">
    are you scared of ghosts?
  </div>
  <div class="dialog-buttons">
    <button id="yesBtn">Yes</button>
    <button id="noBtn">No</button>
  </div>
</div>

<video id="scareVideo" src="2788487501.mp4"></video>

<script>
const loadingScreen = document.querySelector(".loading-screen");
const dialogBox = document.getElementById("dialogBox");
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const video = document.getElementById("scareVideo");

function scare(){
  dialogBox.style.display = "none";        
  loadingScreen.style.display = "flex";     

  setTimeout(function(){
  loadingScreen.style.display = "none";
  video.style.display = "block";
  video.currentTime = 0;
  video.play();
}, 4000);                                 
}                                                                    


yesBtn.addEventListener("click", scare);
noBtn.addEventListener("click", scare);

</script>

</body>
</html>
